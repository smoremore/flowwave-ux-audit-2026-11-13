<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="giscus:backlink" content="https://smoremore.github.io/flowwave-ux-audit-2026-11-13/">
  <title>FlowWave Feedback</title>
  <link rel="stylesheet" href="comments.css">
  <script src="feedback-config.js?v=whole-app-final2" defer></script>
  <script src="feedback-host.js" defer></script>
</head>
<body class="af-host-page">
  <main class="af-host" id="feedbackHost">
    <div class="af-host-status" id="feedbackHostStatus" role="status" aria-live="polite">Kommentare werden geladen …</div>
    <div class="af-host-recovery" id="feedbackHostRecovery" hidden>
      <button class="af-button" type="button" id="feedbackHostRetry" hidden>Erneut laden</button>
      <a class="af-link" id="feedbackHostFallback" target="_blank" rel="noopener noreferrer">Diskussion auf GitHub öffnen</a>
      <details id="feedbackHostDiagnostic" hidden><summary>Technische Details</summary><p id="feedbackHostError"></p></details>
    </div>
    <div class="giscus" id="feedbackGiscus"></div>
    <noscript><p>Zum Kommentieren wird JavaScript benötigt. Die Diskussionen sind auch direkt auf <a href="https://github.com/smoremore/flowwave-ux-audit-2026-11-13/discussions" target="_blank" rel="noopener noreferrer">GitHub</a> erreichbar.</p></noscript>
  </main>
</body>
</html>
